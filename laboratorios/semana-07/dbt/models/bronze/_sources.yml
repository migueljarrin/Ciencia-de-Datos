version: 2

sources:
  - name: raw
    description: "Landing zone cargada por ingest/ingest.py (copia fiel de los parquet de la TLC)."
    database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
    schema: RAW
    tables:
      - name: yellow_tripdata
        identifier: YELLOW_TRIPDATA
        description: "Viajes de NYC Yellow Taxi tal como vienen en los parquet mensuales."
        loaded_at_field: _loaded_at
        columns:
          - name: _source_file
            data_tests: [not_null]
          - name: _source_period
            data_tests: [not_null]
          - name: _loaded_at
            data_tests: [not_null]
      - name: load_audit
        identifier: LOAD_AUDIT
        description: "Bitácora de cargas: archivo, ETag, filas cargadas y fecha."
