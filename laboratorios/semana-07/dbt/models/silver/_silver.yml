version: 2

models:
  - name: slv_yellow_trips
    description: >
      Viajes limpios. Grano: un viaje válido y único. Tipos corregidos, nombres en
      snake_case, códigos alineados con los catálogos oficiales de la TLC, nulos
      tratados, duplicados exactos eliminados y registros inválidos enviados a
      slv_yellow_trips_rejected.
    columns:
      - name: trip_key
        description: "Hash (MD5) de todos los atributos del viaje; identifica al viaje y sirve para deduplicar."
        data_tests: [unique, not_null]
      - name: vendor_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('vendors'), field: vendor_id}
      - name: pickup_datetime
        description: "Hora local de NYC (TIMESTAMP_NTZ, igual que la fuente)."
        data_tests: [not_null]
      - name: dropoff_datetime
        data_tests: [not_null]
      - name: trip_duration_minutes
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1440}
      - name: passenger_count
        description: "NULL cuando la fuente no lo reporta o reporta 0 / más de 6 pasajeros."
        data_tests:
          - accepted_values:
              arguments: {values: [1, 2, 3, 4, 5, 6], quote: false}
      - name: trip_distance_miles
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 500}
      - name: rate_code_id
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [1, 2, 3, 4, 5, 6, 99], quote: false}
      - name: payment_type_id
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [0, 1, 2, 3, 4, 5, 6], quote: false}
      - name: pickup_location_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('taxi_zone_lookup'), field: locationid}
      - name: dropoff_location_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('taxi_zone_lookup'), field: locationid}
      - name: fare_amount
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: total_amount
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1000}
      - name: source_period
        data_tests: [not_null]

  - name: slv_yellow_trips_rejected
    description: "Cuarentena: filas de bronze descartadas en silver con el motivo del rechazo."
    columns:
      - name: rejection_reason
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - missing_timestamp
                  - pickup_outside_file_period
                  - negative_duration
                  - duration_too_long
                  - invalid_distance
                  - negative_amount
                  - amount_outlier
                  - duplicate
